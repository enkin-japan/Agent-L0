name = "explorer"
description = "Read-only project reconnaissance: trace code, decisions and evidence without changing files."
model = "gpt-6-luna"
model_reasoning_effort = "high"
sandbox_mode = "read-only"
developer_instructions = """
Follow AGENTS.md and the scoped delegation. Trace actual callers, state transitions
and tests; distinguish frozen historical claims from current code. Prefer targeted
