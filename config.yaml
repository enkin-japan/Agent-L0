      note: "6.0GB | 实机联调 ✓（2026-07-29：fixup 后 0.5.0 加载，两轮工具闭环）| 长链推理专科候选"
    # ── CUDA 档（bf16 原件，backend: cuda / Colab A100 联调；2026-08-06 用户指定）──
    # revision 已钉死（2026-08-06 HF API 主干 SHA；四仓 lastModified 均早于入库日，
    # 与 Drive 权重一致——凡常驻均应钉死的纪律）。
    # capabilities 按 mlx 同家族口径预填；Qwen3.6 方言按 qwen35 预注册（ChatML 同系，
    # 联调首项即验证模板/标记兼容，不兼容则新增 dialects/<name>/ 再改此声明）。
    # 无 profile = 路由绝不优先选中（未画像纪律）。
    - repo: "google/gemma-4-31B-it"
      revision: "842da3794eaa0b77d5f08bae87a17459d91ff475"
      dialect: "gemma4"
      capabilities: ["text", "vision"]
      # model_eval 2026-08-08 A100 fp8：tool_call 0.96（唯一失败=multiple_21 克制
      # 未调用，26B 同款题）、longchain 0.833、vision 15/15、gen_tps 43 均值
      profile: { tool_call: 0.96, longchain: 0.833, vision: 1.0, vision_hard: 0.838, tps: 43.0 }
      note: "bf16 ~62GB | CUDA 档主模型候选 | A100 联调 ✓ 契约 19/19 | 评测画像已回填（2026-08-08）"
    - repo: "google/gemma-4-26B-A4B-it"
      revision: "4d7ae4984b7db7de8f8457170b3f1a419ee76d52"
      dialect: "gemma4"
      capabilities: ["text", "vision"]
      # model_eval 2026-08-08 A100 fp8（约束采样修复后）：tool_call 0.92（余 2 失败
      # =选错工具/未发起，模型侧 D1 记档）、longchain 0.833、vision 20/20（ChartQA
      # 加难批另测）、gen_tps 157 均值（KV 前缀命中 0.60 均值）
      profile: { tool_call: 0.92, longchain: 0.833, vision: 1.0, vision_hard: 0.811, tps: 157.2 }
      note: "bf16 ~52GB MoE | A100 联调 ✓ 契约 19/19 | 评测画像已回填（2026-08-08）"
    - repo: "Qwen/Qwen3.6-35B-A3B"
      revision: "995ad96eacd98c81ed38be0c5b274b04031597b0"
