      capabilities: ["text", "vision"]
      profile: { tool_call: 1.00, longchain: 1.00, vision: 1.00, tps: 20.1 }  # run 20260730-183929
      note: "6.0GB | 实机联调 ✓（2026-07-29：引擎两轮工具闭环 + 14163 双实例并存冒烟）| 视觉专科候选"
