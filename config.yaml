      dialect: "gemma4"
      capabilities: ["text", "vision"]
      suppress_ghost_thinking: true
      profile: { tool_call: 0.92, longchain: 1.00, vision: 0.84, tps: 101.2 }  # tool run 20260817-004908，其余 20260816-022318
      note: "15.6GB | 静态校验 ✓ | 08-16 画像 ✓ + 26B 缺省档裁决胜出（质量与 8bit 打平、速度 1.34×、省 12G；长上下文×结构化输出弱信号场景路由给 8bit） | MoE，建议 ≥32GB 统一内存"
