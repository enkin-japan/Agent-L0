      capabilities: ["text"]
      # model_eval 2026-08-08 A100 fp8：tool_call 0.88（XML fail-open 下零解析错，
      # 失败=参数取值/克制类）、longchain 1.0 满分、gen_tps 143。
      # ⚠ KV 前缀命中仅 0.03（gemma 系 0.5-0.6）——方言 prompt 布局疑破坏前缀
