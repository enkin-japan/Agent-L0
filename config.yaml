      # model_eval 2026-08-08 A100 fp8：tool_call 0.92、longchain 1.0、gen_tps 144，
      # 零解析错误。9B 档"编排弱"先验大档反转（小档量化伪像）；"长链强"保持。
      # KV 前缀命中 0.0——与 Qwen3.6 同方言同病，见 qwen35 条目观察项
      profile: { tool_call: 0.92, longchain: 1.0, tps: 143.9 }
      note: "qwen3_5_moe 256专家 bf16 ~70GB | A100 联调 ✓ 契约 19/19 | 评测画像已回填（2026-08-08）"

  audio_max_length: 29

  # 模型原生模态声明（任务中心化多模态：文本+图像原生，其余走转写/解析层）。
  # 含 "audio" 才启用原生音频直喂（VAD 切片，仅少数模型支持）；默认不含 → 音频一律 ASR 转写。
  # 换模型只需改这一行：例如原生支持音频的模型可加 "audio"。
  modalities: ["text", "image"]

  # KV Cache 量化（TurboQuant）：默认关闭 = 稠密缓存，行为与不配置时完全一致。
  # kv_bits 设为小数（如 3.5≈质量中性 / 2.5≈轻微下降）即启用；整数走均匀量化。
  # 量化由官方 generate_step 内部完成（全局注意力层量化、滑窗层与末层保持稠密）；
  # 前缀复用/分支/删轮回退均已适配（见 gemma4_generate 的 trim 分支）。
  kv_bits: null                 # null=关闭；小数启用 TurboQuant（推荐 3.5）
  kv_quant_scheme: "turboquant" # turboquant | uniform
  quantized_kv_start: 0         # 从第几个 token 起量化（0=全程；调大可保近端全精度）

  # 工具调用段约束采样（inference-speedup Phase 2）：<|tool_call> 区间内按注册工具的
  # JSON schema 做 logits mask，废轮（格式坏→重试）清零。自由文本/思考段不受约束。
  # 依赖 llguidance；缺库或语法编译失败自动 fail-open 回自由采样（纠错闭环兜底）。
  constrained_tool_calls: true

  # prompt-lookup 投机采样（inference-speedup Phase 3）：从上下文 n-gram 匹配草稿、
  # 主模型批量验证 + 回滚，decode 有效吞吐提升。off=关闭（行为与改动前完全一致）。
  speculative:
    mode: "prompt_lookup"       # off | prompt_lookup
    num_draft_tokens: 8         # 单轮草稿长度 k 上限（无命中时自然退化为普通 decode）
    ngram_max: 3                # n-gram 匹配窗口上限（3→2 逐级降配）
    ngram_min: 2                # 低于该长度不出草稿（1-gram 误命中率过高）

# HTTP 鉴权与跨域（P0）：前后端握手用共享密钥，弃用 IP 绑定（IP 认证的是网络位置而非客户端）。
# api_key 优先读环境变量 AGENT_API_KEY；此处留空占位，真 key 不进仓库。
# 密钥为空 = 未启用（启动告警并放行，便于首启/dev）；设了即强制 Bearer 校验（hmac 常量时间比对）。
# 浏览器侧不持有 key：dev 由 Vite 代理注入 Authorization，生产由 Nginx 注入。
server:
  api_key: ""                       # 留空占位；真 key 经 AGENT_API_KEY 环境变量注入
  allowed_origins:                  # CORS 白名单（仅浏览器直连 14159 时生效；走代理为同源，CORS 不触发）
    - "http://localhost:5173"

# 设备级票据（HETERO_COMPUTE §7 预留 1，B3 落）——**当前留空 = 单密钥期，行为与预留前全同**。
# 背景：原生 macOS/iOS app 自持凭据（不走 Vite 代理注入），届时校验要回答的不是"key 对不对"
# 而是"这是哪台设备"：每台一张票，吊销一台不牵连其余；审批推送等可按设备路由。
# 启用方式：填 devices（device_id: token），校验收敛在 framework/api/auth.py 的
# verify_token() 单一函数里——换 JWT/mTLS 只改那一处。devices 优先于 server.api_key，
# 两者可并存（迁移期）。真 token 同样不进仓库，用环境变量或本地覆盖。
auth:
  devices: {}                       # 例：{ mac-studio: "<token>", iphone-15: "<token>" }

# RAG 知识库服务（rag/ 进程读取本段 + tuning 段；backend 只读 host/port 与之握手）
rag:
  # 设备 A 拿它当绑定地址、设备 B 的 backend 拿它当拨号地址——同 inference.remote.host，
  # 一个键身兼两职。RAG 只有 backend 调用（rag_search/rag_admin/rag_sink 三个客户端都在
  # backend 进程内），前端从不直连本服务。回环单机部署改回 127.0.0.1。
  # ⚠️ 非回环绑定必须配 RAG_API_KEY（两侧 .env.local 同值），否则护栏拒绝启动。
  # B2c 拆分后数据面归工作端本机（回环）；知识库数据（chroma_data/storage）随之在工作端。
  host: "127.0.0.1"
  port: 14160

  # ── 数据/计算拆分（HETERO_COMPUTE B2c）────────────────────────────────────
  # compute.host 空 = 融合模式：rag_server 就地加载模型（拆分前现状，行为逐字不变）。
  # 非空 = 拆分模式：rag_server 只当数据面（Chroma 向量库 + 原文备份 + 路由/治理，
  #   跑在工作端、通常绑回环），嵌入/重排/分词拨号该地址的 compute_server（:14162，
  #   跑在算力端、无状态不落任何用户数据）。host 一键两职（同 inference.remote.host）：
  #   算力端拿它当绑定地址、工作端拿它当拨号地址。
  # ⚠️ 拆分跨机必须两侧 .env.local 设同一 RAG_COMPUTE_API_KEY（compute 非回环绑定 +
  #   空 key = 拒启）。拓扑切换步骤：数据目录（chroma_data/ + storage/）先从算力端
  #   迁到工作端，再改本段 + rag.host，最后算力端改跑 `start --profile gpu`。
  compute:
    host: ""                    # 缺省空 = 融合（本地）模式。拆分部署不改本文件：各机
    port: 14162                 #   .env.local 填 RAG_COMPUTE_HOST（同上一键两职）

  # ── RAG 档位注册表（镜像 inference.model_registry 的选择制，HETERO_COMPUTE B2a）──
  # 一个"档位" = 一对 {嵌入模型, 重排模型}（同尺寸同家族）。调试期换档走**选择**而非手填：
  #   ./devctl.sh rag-model   交互选择 → 写仓库根 .rag-tier-selection（gitignored 指针）
  # rag_server.py 按「指针 → active_tier 默认 → 下方 embed_path/rerank_path 兜底」解析；
  # 下载仍收敛到 rag/models/（resolve_model_path，不变）。
  #
  # 关键不变量（换档纪律）：向量库一旦入库，档位即固定；换档 = 开发者**主动重建**
  #   （rag/scripts/reembed.py 从 storage/raw_files 全量重灌），运行中/用户侧绝不换。
  #   换档若嵌入维度与旧库不符，服务启动/入库会**快速失败**并提示先 reembed（护栏）。
  #
  # 字段：modality=text 纯文本 / vl 视觉多模态（Qwen3-VL；图像真入库属 L2 另一期，
  #   当前 vl 档仅"加载 + 文本 I/O"，见 HETERO_COMPUTE §S.3）；embed_dim 该档向量维度
  #   （护栏比对用的**提示值**：启动恒以运行时探测为准，不符只告警，null=无提示）；
  #   dtype 加载精度（fp16 现状 / bf16 开发机
  #   单拉 RAG 实测 VL / 8bit 量化归设备 A）；thresholds 该档余弦空间三阈值（分布随尺寸变，
  #   0.6B 为实测标定值，其余为占位继承、标注"待设备 A 标定"，真跑该档时用召回回归集重定）。
  active_tier: "text-0.6b"      # 当前档位 id（被 .rag-tier-selection 指针覆盖）
  tiers:
    - id: "text-0.6b"
      modality: "text"
      embed_repo: "Qwen/Qwen3-Embedding-0.6B"
      rerank_repo: "Qwen/Qwen3-Reranker-0.6B"
      embed_dim: 1024
      dtype: "fp16"
      thresholds: { insert_routing_max_distance: 0.8, query_routing_max_distance: 0.85, rerank_min_score: 0.5 }
      note: "~2.4GB | 实测标定 ✓（默认，开发机现状）"
    - id: "text-4b"
      modality: "text"
      embed_repo: "Qwen/Qwen3-Embedding-4B"
      rerank_repo: "Qwen/Qwen3-Reranker-4B"
      embed_dim: 2560
      dtype: "bf16"
      thresholds: { insert_routing_max_distance: 0.8, query_routing_max_distance: 0.85, rerank_min_score: 0.5 }
      note: "~16GB fp16 | 阈值待标定 | 开发机可单模型/8bit 试载，双模型 bf16 偏紧"
    - id: "text-8b"
      modality: "text"
      embed_repo: "Qwen/Qwen3-Embedding-8B"
      rerank_repo: "Qwen/Qwen3-Reranker-8B"
      embed_dim: 4096
      dtype: "bf16"
      thresholds: { insert_routing_max_distance: 0.8, query_routing_max_distance: 0.85, rerank_min_score: 0.5 }
      note: "~30GB fp16 | 生产档 | 需设备 A（≥40GB 或双卡分置）"
    - id: "vl-2b"
      modality: "vl"
      embed_repo: "Qwen/Qwen3-VL-Embedding-2B"
      rerank_repo: "Qwen/Qwen3-VL-Reranker-2B"
      embed_dim: 2048            # 实测回填（B2b：开发机 M4 bf16 单拉 RAG，与官方 1_Pooling 一致）
      dtype: "bf16"
      thresholds: { insert_routing_max_distance: 0.8, query_routing_max_distance: 0.85, rerank_min_score: 0.5 }
      note: "多模态最小档 | 加载契约已实测 ✓（阈值仍待标定）| 图像入库=L2 另一期"
    - id: "vl-8b"
      modality: "vl"
      embed_repo: "Qwen/Qwen3-VL-Embedding-8B"
      rerank_repo: "Qwen/Qwen3-VL-Reranker-8B"
      embed_dim: 4096            # 官方模型表声明值，**未实测**（需设备 A）；启动仍以运行时探测为准
      dtype: "bf16"
      thresholds: { insert_routing_max_distance: 0.8, query_routing_max_distance: 0.85, rerank_min_score: 0.5 }
      note: "多模态生产档 | 需设备 A"

  # 兜底（无 tiers / active_tier 未命中时回退的旧路径；被选中档位覆盖）：
  embed_path: "Qwen/Qwen3-Embedding-0.6B"    # 本地路径或 HF Repo ID（优先 rag/models/）
  rerank_path: "Qwen/Qwen3-Reranker-0.6B"
  max_length: 8192   # tokenizer 截断长度
  batch_size: 32     # 向量化批大小

# RAG 检索与路由调优（仅 rag/ 进程读取；所有距离均为余弦距离，0~2 越小越相似）
# 注：三个阈值（insert_routing / query_routing / rerank_min_score）若在 rag.tiers 选中档位的
#     thresholds 里给出，则**以档位值为准**（余弦分布随模型尺寸变，须各档各自标定）；
#     此处为档位未覆盖时的全局兜底值。其余切块/召回参数与档位无关，恒读本段。
tuning:
  insert_routing_max_distance: 0.8   # 入库时：文档与分类描述的最大距离，超过流入未分类库
  query_routing_max_distance: 0.85   # 查询时：意图与分类描述的最大距离，超过的库被剔除
  query_max_dbs: 3                   # 查询时：最多并发检索几个分类库
  query_max_chunks: 4                # 查询时：每个库最多召回几条片段
  query_final_max_results: 3         # 重排后最终返回的最大条数
  rerank_min_score: 0.5              # 重排分数（0~1）低于该值的片段被过滤
  chunk_max_tokens: 256              # 切块：每块最大 token 数
  chunk_overlap_tokens: 128          # 切块：相邻块之间的重叠 token 数

# 摄入解析层（Ingestion）：非原生模态在进模型前的急解析。文本+图像原生直喂，音频经 ASR、
# PDF/办公文档经解析折成带 provenance 标记的文本注入上下文；代码/大文件懒登记（只给路径，
# 靠 file_extract/shell 按需取）。解析发生在推理 worker 之外，结果烘进历史日志、重放不重解析。
ingestion:
  # 转写实现（backends 注册面）。"auto" = 跟随 inference.mode：mode=remote（推理在设备 A）
  # → 转写也在 A（R5-2/D.14：edge 不留 whisper/torch/librosa）；mode=inprocess → 本机 mlx_whisper。
  # 刻意默认 auto 而非某个具体实现：两个旋钮各说各话时症状很隐蔽——mode=remote 却把 asr
  # 留在 mlx_whisper，edge 就得为一个用不上的转写实现继续背 torch 全家，且没有任何报错。
  # 可显式覆盖为 mlx_whisper / remote。
  asr_provider: "auto"
  asr_model: "mlx-community/whisper-large-v3-turbo"  # ASR 模型（懒加载、进程内复用）
  asr_language: null            # null=自动检测语种；也可固定如 "ja"/"zh"/"en"
  pdf_text_min_chars_per_page: 50  # PDF 每页平均字符数低于此判为扫描/图像型→渲染成图走原生视觉
  pdf_render_max_pages: 20      # 图像型 PDF 最多渲染的页数（其余用 file_extract 抽文本）
  parse_max_chars: 12000        # 单文件解析文本注入上限（超出截断，余量用 file_extract 回源）
  text_inline_max_chars: 4000   # 纯文本内联上限，超出转懒登记；代码一律懒登记不内联

# 联网调查（web_research）：受限沙箱知识扩充。主体只调 web_research 一个工具、只拿回摘要；
# 原始网页与搜索/抓取器全封在 framework/agents 内部（方案 b：物理隔离），主 MCPRegistry 不扫描。
# 需本机起 SearXNG（原生 venv 部署、无 Docker，devctl.sh 管理；须在 settings.yml 开启 json 输出）；
# 离线则 web_research 自动不注册。
web_search:
  # 恒为回环：SearXNG 与 backend 始终同机（all-in-one 自不必说；算力分离下它归 --profile edge
  # 的设备 B，不是设备 A——它不出算力，只是 web_research 的依赖，抓正文的 T0/T1/T2 本就在
  # backend 里跑）。故这里不像 inference.remote.host / rag.host 那样需要随拓扑改。
  # ⚠️ 别改成远端地址：SearXNG 的 limiter 已关且无任何鉴权（不同于另外三个服务的 API_KEY），
  # 一旦离开回环就是一个人人可用的搜索代理（见 searxng/settings.yml:9）。
  searxng_url: "http://127.0.0.1:8080"
  timeout: 15                # 单次搜索/抓取的 HTTP 超时（秒）
  max_results: 8             # web_search 返回候选上限
  max_pages_per_call: 3      # 单次 open_pages 模型主动选取的抓取页数（与观察预算对齐）
  min_valid_pages: 2         # 有效正文（非 403/非空壳）目标数；不足时自动从候选池补抓
  backfill_max: 5            # 补位阶段最多额外尝试的候选数（防止把所有候选抓穿）
  fetch_concurrency: 3       # 静态档（T0/T1）并行抓取数；T2 无头渲染始终串行
  per_url_budget_seconds: 25 # 单 URL 三档升级的总时间预算，超时放弃后续档位（防慢站拖垮整轮）
  # 抓取升级阶梯（每个 URL 逐级兜底：T0 requests 静态 → T1 指纹模拟 → T2 无头渲染）：
  impersonate_enabled: true  # T1：静态被 403/空壳时用 curl_cffi 模拟 Chrome TLS 指纹重试（破 JA3/Cloudflare 一类拦截）
  render_enabled: true       # T2：T0/T1 仍拿不到正文（JS 渲染页）时用系统 Chrome 无头渲染兜底；缺 Chrome/Playwright 自动降级
  render_wait_ms: 2500       # T2 渲染后额外等待网络空闲的毫秒数，给 JS 填充 DOM 的时间
  per_page_max_chars: 2500   # 每页正文注入沙箱上下文的字符上限（1500 实测会把说明页
                             # 铺垫之后的关键表格截掉，如税率速算表）
  max_steps: 6               # 沙箱 ReAct 循环步数上限
  total_timeout: 240         # web_research 整体墙钟熔断（秒）。110 → 240（2026-07-17 实测）：
                             # 远端 e4b 上一次完整调查（3 次生成 + 抓取）约 2~3 分钟，110s
                             # 连两次生成都放不下，简报干跑必超时。工具自带 timeout_seconds
                             # = 此值+30 覆盖全局（excel_research 同款），不再受 180s 全局墙压制
  convergence_reserve_seconds: 30  # 距 total_timeout 不足此秒数时沙箱停发工具调用、
                                   # 用已收集材料强制收敛出摘要（把超时全损变为部分交付）
  engines: []                # 可选：限定 SearXNG 引擎（如 ["duckduckgo","brave"]），空=用默认
  content_farms:             # 域名黑名单（内容农场 / 已知强反爬站）：信誉压到最低，排到候选末尾
    - "cn.investing.com"     # Cloudflare 质询站，静态抓取必 403，先沉底减少无谓尝试
    - "investing.com"

# 网页阅读（web_read）：读用户明确给出的 URL 并返回忠实摘要——web_research 的姊妹快通道。
# 复用同一套沙箱抓取/反投毒管道（L2-L4，旋钮沿用上面 web_search 段），跳过搜索与 ReAct
# 循环：抓页 → 单次生成总结。物理隔离不变量相同：原文不进主体上下文。不依赖 SearXNG。
web_read:
  max_pages: 3               # 单次最多阅读的页面数
  per_page_max_chars: 8000   # 单页任务字符预算放宽（调查任务是多页交叉，才压到 2500）
  summary_timeout: 90        # 摘要生成熔断（秒）；连同抓取受 agent.tool_timeout_seconds 兜底
  max_summary_tokens: 2048   # 摘要生成 token 上限

# 数学攻坚子 agent（math_research）：离线 Python/SymPy 沙箱内多步"写码-执行-验证"，
# 最终答案由解释器输出程序化提取（submit_answer 机制，不经模型转写）。
# 沙箱循环与执行器封在 framework/agents（math_sandbox/math_tools），主表只见包壳工具。
math_research:
  max_steps: 8          # 沙箱内部 写码-执行 循环步数上限
  exec_timeout: 20      # 单次代码执行墙钟（秒）
  total_timeout: 170    # 整体熔断（秒）；须 < agent.tool_timeout_seconds
  max_parse_retries: 2  # 工具调用格式崩坏的重试预算

# Excel 工程子 agent（excel_research）：seatbelt 沙箱内多步"写码-验证-修复"，
# 交付必须过 verify 门禁（LibreOffice 影子重算 + 契约断言 + 改动半径审计 + 视觉回读），
# verdict 由 harness 直读、GO 时哈希封印交付文件——模型伪造不了判决、验证后偷改会被抓。
# 沙箱循环/REPL/验证链封在 framework/{agents,excel}，主表只见包壳工具。
# 系统依赖：LibreOffice（brew install --cask libreoffice，缺失则工具不注册）
#          poppler/pdftoppm（brew install poppler，缺失仅降级视觉回读）。
excel_research:
  max_steps: 14           # 沙箱内部循环步数上限（写码+验证+修复都算步）
  exec_timeout: 60        # 单次 run_python 墙钟（秒）；超时杀 REPL、变量丢失自动重启
  recalc_timeout: 120     # LibreOffice 影子重算熔断（秒）
  render_timeout: 120     # 渲染 PNG（PDF+pdftoppm）熔断（秒）
  render_dpi: 100
  total_timeout: 540      # 整体硬熔断（秒）；包壳工具声明 timeout_seconds=此值+30 覆盖全局
  repair_budget: 3        # 连续 NO-GO 修复轮预算，超了令模型 blocked 诚实交回
  max_parse_retries: 2    # 工具调用格式崩坏的重试预算
  max_changed_default: 500  # 编辑已有文件时的改动单元格默认上限（契约 max_changed 可覆盖）
  visual_qa: true         # 渲染页走一次性 VLM 单发回读（####挤压/表头错位/格式失效）

# PPT 制作（deck_* 工具组）：Deck Spec 落 sessions/{id}/deck/deck.json（单一真相），
# 前端检视面板 Deck 页签实时投影；图表由 render_chart 核心代码渲染（模型不写绘图代码）。
# PDF 导出用无头 Chrome 打印前端 /print/deck 路由——渲染器只有一份，预览即所得，
# 因此导出依赖前端服务在跑（dev: Vite 5173 / 生产: Nginx 同源端口）。
ppt:
  frontend_base_url: "http://localhost:5173"  # 打印路由的宿主（生产切 Nginx 地址）
  export_timeout: 40    # PDF 导出总预算（秒）；须 < agent.tool_timeout_seconds

# 编排循环护栏（多步任务 Agent）
agent:
  max_inference_concurrency: 1 # 并发生成上限（B1）：默认 1 行为与现状全同；仅 remote 模式
                              # 允许 >1（进程内后端共享单例不可并发，引擎强制钳制回 1）
  tool_schema_mode: "full"    # full=全部工具 schema 常驻（工具少时更省且缓存更稳）
                              # catalog=目录常驻 + get_tool_schema 按名取详情（工具规模大后切换）
  react_max_steps: 4          # 单步内自纠预算：一步连续多少次迭代未完成即判定失败并路由
  max_total_iterations: 40    # 一轮任务的总推理次数熔断
  replan_max: 3               # 整体重规划（推翻已有计划）次数上限
  observation_max_chars: 4000 # 单条工具观察截断上限（保护每步延迟与上下文）
  tool_timeout_seconds: 180   # 单次工具执行熔断：超时则放弃等待并反馈模型改路
                              # （120→180：math_research 沙箱需 3~5 次内部生成，e4b 上 110s 不够收束）
  max_parse_retries: 3        # 工具格式反复解析失败的断环阈值（同一坏调用重复≥此值即优雅终止）
  goal_verify: true           # 收尾目标校验（DEFERRED §2 完整版）：计划≥3步全部完成后，用一次独立
                              # 小生成审计「最终答复是否兑现原始目标」，FAIL 推回自纠一次（防虚报完成）。
                              # 上马依据：2026-07-12 A/B 实测长任务两侧确定性虚报完成（触发条件 1）
  notes_dream:                # dream 式笔记整理（空闲维护回合低频触发，治笔记只增不理）
    enabled: true
    min_hours: 24             # 距上次整理至少这么久才再触发
    min_new_notes: 4          # 且新增/变动笔记数达到这么多（两闸同过才整理）

  drift_patrol:               # 依赖时效巡检（phase 1 只报不修）：对抗外部活服务的依赖
    enabled: true             # （yt-dlp/SearXNG/curl_cffi/playwright）canary 探针轮巡，
    min_hours: 72             # 失效写告警笔记（经记忆索引抵达对话）。单项两测最小间隔（时）
    fail_threshold: 2         # 连续失败达此数才告警（防单次网络抖动误报）
    canary_timeout: 90        # 单次探针熔断（秒）

  thinking_mode: "dynamic"    # 思考位置策略（前端开关的语义翻译，orchestrator 生效；沙箱/摘要不受影响）：
                              # dynamic=关思考→首轮自动思考+后续关闭；开思考→全程常开（前端语义重定义，零前端改动）
                              # first_only=关→全不思考；开→仅首轮思考
                              # manual=旧语义直通：关→全不思考；开→全程思考
                              # 收益/代价经 token_breakdown 仪表观测；闲聊延迟不达预期再给 dynamic 配独立小预算

  # 环境上下文注入（想法1）：把稳定的环境事实预注入到 system 尾部锚点块（与当天日期同处一块），
  # 帮小模型少猜少绕。机器事实（OS+架构）自动探测；个人事实默认全空、opt-in、仅填写后注入。
  # 隐私：这些只进主编排上下文，绝不进联网/数学/Excel 沙箱（沙箱子生成 include_env=False，
  # 物理隔离方向一致）。注意"最小相关集"——弱模型上下文越多注意力越稀释，勿堆砌。
  environment:
    inject_machine: true   # 自动注入操作系统+架构（桌面级 shell/路径任务有用）；false=不注入机器信息
    inject_timezone: true  # 自动注入系统时区（IANA 名+UTC 偏移）：相对时间锚点+国家级粗位置；精确位置走 get_location 工具按需查
    inject_locale: true    # language 未填时自动注入系统区域标识（如 ja_JP）作兜底；language 已填则不注入
    language: null         # 偏好应答语言，如 "中文"/"日本語"；null=不注入（模型按用户消息语种自适应）
    location: null         # 大致所在地（城市级即可，如 "东京"）；时区已给国家级粗位置、精确位置有 get_location 工具，通常留空即可
    about: null            # 一句话用户画像/偏好，如 "工程背景，偏好简洁中文"；null=不注入

  # 单 worker 调度（ClassPolicy：确定性两级规则，无启发式）。
  # 交互任务（chat/approval/resume）> 后台任务（summarize，priority=-1）由优先级排序天然实现。
  scheduler:
    preempt_background: true  # 交互任务到达时取消让位运行中的后台摘要（摘要可安全放弃、下次重试）
    aging_seconds: 300        # 排队超过该秒数有效优先级抬一档（防后台任务饿死）；0=关闭老化

  # 上下文压缩（Step 1：机械式工具观察压缩，T3-a/b 升级为「预算感知 + 取代感知」）。
  # 取代去重：同一只读工具对同一目标的重复读取，较旧那条被后续读取取代（无夹写才取代）。
  # 预算驱逐：全部观察总字符越过 observation_budget_chars 才在旧区按体量驱逐；不越则旧观察保持原文。
  # 只改内存历史，持久化日志与前端展示保留全量。摘要式二次压缩见后续 Step。
  observation_keep_recent: 6    # 最近多少条工具观察为硬保护窗口（永不改动，保任务内 KV 复用）
  observation_compact_chars: 200 # 压缩后每条观察保留的首部字符数
  observation_budget_chars: 20000 # 机械层观察总预算（字符）：越过才驱逐旧大观察，保守偏大

  # 摘要式二次压缩（Step 2，方案A）：越过阈值把旧轮次折叠进 memory.json 的滚动摘要，
  # 全量日志保留，model-facing 上下文重建为 [system]+[摘要]+[尾部]。触发共用一套摘要器：
  #   高阈值=活跃期兜底（轮次落盘后判定，会触发一次重预填充，设高、少触发）；
  #   低阈值=空闲/冻结前优化（KV 反正要释放，近乎免费，设低）。
  # 阈值语义（D4 修正）：配置值 = 稳定前缀（工具声明）**之上**的历史 token 预算。
  # 比较基准 last_prompt_tokens 量的是整个 prompt，而前缀地板 ≥9k——裸阈值会被前缀
  # 单独吃满、恒触发折叠。启动时编排层自动抬为 前缀估算+配置值，工具增减免重调参。
  summary_high_threshold: 8000  # 活跃期：历史超出前缀 8k token 即折叠旧轮
  summary_low_threshold: 2000   # 空闲将冻结前：历史超出前缀 2k 即折叠旧轮
  summary_keep_tail_turns: 4    # 折叠时尾部保留的最近轮次数（这些保持原文）
  summary_idle_seconds: 300     # 会话空闲超过此秒数即进入低阈值摘要维护（应 < 冻结超时 1800）

  # 长期记忆沉淀（Stage 3）：折叠旧轮次时把其原文沉淀进 RAG 的 agent_memory 类目，
  # 作为压缩的无损承重网——上下文摘要有损，被折叠掉的细节仍可经 rag_search 召回。
  sediment_to_rag: true         # 关闭则只压缩不沉淀（被折叠内容仅留摘要，不可召回细节）


# 云端顾问（混合架构第 2/3 站；CHARTER 铁律 6：云端只顾问不执行）。cloud_consult 工具把
# question+context 经 **L0 出网守卫脱敏后**发给所选供应商、取回纯文本建议并本地回填
# 占位符；落地动作永远由本地模型走既有审批闸门。出网前人工审批按 require_approval 旋钮；
# 每次出网无条件记 DATA_DIR/cloud/egress.jsonl 台账（铁律 6 出网日志 + 脱敏报告 + 费用）。
# 密钥一律 .env.local 环境变量（本文件只存 key_env 变量名，内联密钥字段会被拒启）。
# providers 为空或全部无 key = 工具不注册（离线纯本地形态零变化）。kind 只有两种：
#   openai_compat  OpenAI 及一切兼容面（DeepSeek/OpenRouter/国产托管/自建 vLLM——换
#                  base_url+model 即插即用）；max_tokens_field 按各家要求（OpenAI 新模型
#                  要 max_completion_tokens，多数兼容面用 max_tokens）
#   anthropic      Claude Messages API
# input/output_usd_per_m 是**预算护栏的计价**（按官网现价自行维护；价格变了护栏口径
# 跟着变，不影响调用本身）。零保留/数据不训练档位在各家控制台侧配置（CHARTER §3）。
cloud:
  daily_budget_usd: 2.0        # 出网日预算（美元）：台账累计达此值当日拒绝出网；0=不设限
  max_tokens: 2048             # 单次顾问回复上限
  timeout: 120                 # 单次调用 HTTP 超时（秒）；须 < agent.tool_timeout_seconds
  # ── L0 出网守卫（铁律 6 第 2 条）：payload 出网前脱敏，建议返回后本地回填 ──
  # 规则腿（email/电话/IP/密钥/卡号 Luhn）**无条件恒开**；模型腿抓语境标识（人名/
  # 住址/雇主），独立上下文单发、失败降级为规则腿结果并在台账显式标注。
  require_approval: true       # 出网前人工审批（审批卡=脱敏前原文）。L0 试运行期恒
                               # true；信任建立后可关——关的是人工闸，脱敏与台账仍恒开
  sanitize_model: true         # L0 模型腿开关（false=纯规则脱敏，语境标识靠人工审批把关）
  sanitize_timeout: 45         # 模型腿单发熔断（秒）：超时=规则腿结果 + unavailable 标注
  providers:                   # 声明序 = 缺省选择序（第一个配了 key 的当默认）
    - name: "openai"
      kind: "openai_compat"
      base_url: "https://api.openai.com/v1"
      model: "gpt-5"                       # 按需换档（官网现役型号）
      max_tokens_field: "max_completion_tokens"
      key_env: "CLOUD_OPENAI_API_KEY"
      input_usd_per_m: 1.25
      output_usd_per_m: 10.0
    - name: "anthropic"
      kind: "anthropic"
      base_url: "https://api.anthropic.com"
      model: "claude-opus-4-8"             # 省成本可换 claude-sonnet-4-6（3/15）
      key_env: "CLOUD_ANTHROPIC_API_KEY"
      input_usd_per_m: 5.0
      output_usd_per_m: 25.0

# 定时任务（schedule）：落盘一等实体，模型经 schedule_* 工具管理（创建/修改需审批），
# 到点在专属会话（schedule_{id}）无人值守执行；被交互任务 suspend 抢占、审批自动拒绝。
schedules:
  tick_seconds: 30        # 触发扫描周期（秒）
  run_history_keep: 50    # 每任务运行历史保留条数（runs.jsonl 超出截断头部）
  min_interval_minutes: 5 # interval 型下限（防模型排出高频轰炸）

# iOS 推送（framework/push：APNs 直发，纯出站 HTTPS，后端回环绑定不变）。
# macOS 客户端不经此层（app 常驻订阅 feed 发本地通知，零出网）。
# 前置一次性人工步骤：developer.apple.com → Keys → 新建启用 APNs 的密钥 →
#   下载 AuthKey_XXXXXXXXXX.p8（只给下载一次），把路径/KeyID 填进下面两项。
# apns_key_path 为空 = iOS 推送整体禁用（dispatcher 不发一个字节，接口仍可注册设备）。
# 相对路径 = 相对仓库根；约定放 .keys/（已 gitignore——git 同步不携带，换机要手动拷一次）。
# 环境（TestFlight=生产 / Xcode 直装=沙箱）无需配置：按设备自动探测并粘滞学习。
push:
  enabled: true
  apns_key_path: "./.keys/AuthKey_645U4V9MAX.p8"                 # 例：.keys/AuthKey_ABC123DEFG.p8（绝对路径/~ 也认）
                                    # 相对路径先按仓库根找，落空再按数据根（AGENT_DATA_DIR）找——
                                    # app bundle 形态把 .p8 放 ~/Library/Application Support/dev.enkin.macagent/.keys/
  apns_key_id: "645U4V9MAX"                   # 密钥页显示的 Key ID（10 位）
  apns_team_id: "9A84P4ZS84"        # Apple Developer Team ID
  bundle_id: "dev.enkin.macagent"   # iOS app 的 bundle id（apns-topic）
  approval_ttl_seconds: 900         # 鉴权通知的投递时限（过期不投；决议端点另有 turn_id 防错批）
  live_activity:
    enabled: true
    heartbeat_seconds: 60           # 滚动 stale-date 心跳（低优先级，静默窗口才补发）
    stale_seconds: 150              # 无更新超过此秒数，iOS 自动把灵动岛标记为过期
    min_push_interval: 2.0          # 阶段更新节流下限（秒）；审批/收尾等硬转折不受限

# 会话记录清理（session_cleanup）：sessions/ 随会话堆积，此层做确定性磁盘回收。
# 反转默认——默认自动过期、pin 才长留；这样"越囤越懒"的死循环不成立（只手动做加法=保留）。
# 复用 SessionManager.delete_session（并发安全：取消标志→会话锁→discard→rmtree），硬删不进回收站。
# 一律跳过：已 pin（meta.json）、调度活跃（is_active：运行/排队/挂起）、进行中（inflight.json）、
#          定时任务执行会话（schedule_ 前缀，由 ScheduleStore 独立管理）。
# 起算点：有内容会话取最后更新（history.jsonl mtime，度量"闲置"而非"年龄"）；空壳取创建时间。
session_cleanup:
  enabled: true               # 关闭则只留手动删除（前端/DELETE 端点仍可用）
  retention_days: 30          # 有内容会话：最后更新距今超过此天数即回收
  empty_ttl_hours: 24         # 空壳会话（无历史/0 轮）：创建距今超过此小时数即回收
  scan_interval_seconds: 3600 # 后台清扫扫描周期（秒）
