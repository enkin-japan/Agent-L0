    - repo: "mlx-community/gemma-4-31b-it-4bit"
      revision: "696d436c404745a59f30e4939a658162b0a9e57f"
      dialect: "gemma4"
      capabilities: ["text", "vision"]
      suppress_ghost_thinking: true
      profile: { tool_call: 0.96, longchain: 0.83, vision: 0.90, tps: 27.8 }  # tool run 20260817-005105，其余 20260816-025147
      note: "18.4GB | 静态校验 ✓ | 08-16 画像 ✓ | 31B 唯一在册档兼长上下文位（D.20 后 31b-8bit/qat 舍弃；64k 15.8tps 不 OOM）| 稠密，建议 ≥32GB 统一内存"
