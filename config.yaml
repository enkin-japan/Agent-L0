# config.yaml —— 整个项目唯一的配置文件（backend 与 rag 两个进程共用；改这里即可）
# 段落归属：inference/server/ingestion/web_search/web_read/math_research/ppt/agent/schedules → backend；
#          rag（host/port 两侧共用，其余键仅 rag）/ tuning → rag。
inference:
  host: "127.0.0.1"  # 仅本机回环：外部访问统一走前端的 /api 代理
  port: 14159

  # 推理承载（HETERO_COMPUTE B1）：inprocess=本进程加载 backend 所指后端；
  # remote=经 backends/remote 连下面 remote 段所指的 inference-server（inference/server.py，
  # 服务端进程读同一份 config 的 backend 键决定它内包哪个后端）。
  # 远程模式密钥：两侧 .env.local 设同一 INFER_API_KEY（服务端校验、客户端携带）。
  # ⚠️ 本文件是**通用模板**：remote.host / rag.compute.host 缺省为空，不钉任何机器的
  #    地址。机器专属值落各机 .env.local（INFER_REMOTE_HOST / RAG_COMPUTE_HOST，devctl
  #    启动自动装载）；app 形态在设置页"执行层"填算力端地址，SidecarManager 注入。
  #    mode=remote 而地址为空 = 启动拒启并指引（填写地址，或 mode 改 inprocess 单机部署）。
  # 运行时覆盖优先级：环境变量非空即覆盖本文件的两个 host（一键两职语义不变）。
  # 密钥强度护栏：非回环绑定要求密钥 ≥16 字符（"test" 一类弱值拒启）——`./devctl.sh keygen`
  #    生成强随机值并打印部署指引。0.0.0.0 绑定是显式 opt-in（如本机 cloudflared 之外的
  #    转发面需要），护栏同样生效；入站面仍应收在 tailnet/隧道内（§8）。
  mode: "remote"                # inprocess | remote
  backend: "mlx"                # mlx | cuda(A1 后)：进程内所用/服务端内包的后端
  remote:
    host: ""                    # inference-server 地址（算力端拿它当绑定地址、工作端拿它当
    port: 14161                 #   拨号地址——同一个键身兼两职。D7 端口约定 :14161）
                                #   缺省空 = 未配置：mode=remote 时启动拒启。各机 .env.local
                                #   填 INFER_REMOTE_HOST=本机(算力端)/对端(工作端)的 tailnet IP
    cache_ttl_minutes: 45       # 服务端缓存注册表空闲回收（略长于 backend 30min 冻结，只兜底）
  # ── 多模型常驻的追加端点（接口准备③/Q10；缺省注释掉 = 单端点现状，零回归）──
  # 每模型一实例一端口（多 port + 固定端口：14163 起顺延，14162 归 RAG 计算面），
  # host 一律共享 remote.host（统一 host，Q10）。repo 必须先在 model_registry 注册
  # （方言/revision/capabilities 以注册表为单一真相）。算力端起第二实例：
  #   INFER_PORT=<port> INFER_MODEL_REPO=<repo> python inference/server.py
  # 工作端 backend 装配期校验本段并注入 RemoteBackend（base_url_for(name) 取址）。
  # 2026-08-08 路由 E2E 已实测通过（80G 站：main=31B:14161 + moe-fast=26B:14163，
  # 注册/选址/tailnet 双端点承载全通；chat/summary 恒 main 粘滞、质量 kind 走
  # 0.05 边际挑战逻辑均按设计）。测后回归注释态；生产常开待实机拓扑定型时拍板。
  # endpoints:
  #   - name: "moe-fast"        # 端点名（将来专科调用按名引用；main 为保留名）
  #     repo: "google/gemma-4-26B-A4B-it"
  #     port: 14163
  # KV 冻结落盘（T2/Q9-a）：会话冻结时把 KV 缓存序列化到承载端本地盘，解冻热恢复
  # （实测省 3-13s/次）。KV 是对话派生物——真两机拓扑下它落在算力机的盘上；介意
  # 会话残片留在设备 A 就设 false（解冻退基座克隆，只慢在摘要+尾部重预填）。
  kv_persist: true
  # ── CUDA 后端旋钮（backend: "cuda" 时生效；Colab/生产 GPU 档）────────────
  # quantization fp8：Ampere（A100）无原生 FP8 核，vLLM 走 Marlin weight-only
  # 在线量化（bf16 原件加载即量化，显存约砍半）；Hopper 起为原生 FP8。
  # 置空/null = 不量化（bf16 直跑，35B 档 A100 80GB 很紧）。
  cuda:
    quantization: "fp8"
    gpu_memory_utilization: 0.92
    max_concurrency: 8            # T7：服务面生成并发闸（vLLM 连续批处理承载；
                                  # MLX 后端忽略此键恒为 1=旧互斥语义）
    max_model_len: 65536          # D.19（2026-08-09）：8 页 deck 单轮 ~33k 撞 32768 顶实案；
                                  # L4 fp8 KV 池 114,963 token / A100 档 KV 3.7GiB 均有余量
    tensor_parallel: 1
    enable_prefix_caching: true   # 引擎内自动前缀缓存 = 本后端 clone/复用的物理承载
    enforce_eager: false          # true 可跳 CUDA graph 编译省启动时间（调试用）
    trust_remote_code: false
  model: "mlx-community/gemma-4-e4b-it-8bit"
  # 钉死 HF 仓库 commit（2026-08-14 升钉的上游 7/6 重转换件）。缺省档 2026-08-16
  # 随 D.20 阵容收束由 e4b-4bit 改为 e4b-8bit（4bit 档舍弃）。
  # 再动 mlx 全家桶时同样要重验 framework/backends/mlx/patch/ 下的补丁。
  model_revision: "4255b21bd9a9d3fc807ef7abd80373f5e3a52a73"

  # ── 模型注册表（gemma-4 / Qwen 两家族 + CUDA 部署形态）──────────────────
  # 启动选择的候选集：`./devctl.sh model` 交互选择，选中项写仓库根 .model-selection
  # （gitignored 指针文件），app.py 按「选择文件 → 上面的 model 默认」次序解析——
  # 换模型不必手改本文件。revision 逐条钉死在 scripts/check_model_contract.py 静态验证
  # 通过的转换（参数名集合与模型骨架逐一对齐）。历史：上游 07-05/06 re-upload 对
  # mlx-vlm 0.5.0 的兼容性分档而异（e4b 三档被裁共享 KV 权重 → missing 54 只能停旧版；
  # 26b/31b 六档全对齐已跟进）。〔2026-08-14 升级 mlx-vlm 0.6.13 后此分裂消失：
  # e4b 三档已升钉 07-06 新版（contract ✓ / 4bit 装载生成 ✓），12B 解禁入列。〕
  # 〔2026-08-16 D.20 阵容收束：本表收口为 6 档——e4b-8bit（缺省）/ 26b-4bit（26B
  # 缺省）/ 26b-8bit / 31b-4bit / Qwen3.8-27B 4bit+8bit，另保留 CUDA 侧部署形态；
  # 舍弃的 11 条（Ornith-9B/Qwen3.5-9B/12b×2/e4b-4bit/26b-qat/31b-8bit/31b-qat/
  # nvfp4×3）与 CUDA 侧 3 条（Qwen3.6/Ornith-35B×2）见 D.20 收束 commit 之前的
  # 版本（台账 2026-08-16「阵容收束」条）。〕
  # suppress_ghost_thinking：官方 thinking 文档要求 12B/26B/31B 关思考时在 model 轮
  # 开头预填空思考频道抑制「幽灵思考」（e4b 模板无此要求）。PromptBuilder 按此开关生效，
  # 预填形态须与官方模板逐字节一致（尾部无换行——多一个 \n 即「发现 A」，2026-08-14）。
  model_registry:
    # dialect（R0）：模型方言 = prompt 模板 + 输出反序列化 + 频道/工具标记 + 调用体 schema。
    # 实现在 backend/framework/dialects/<name>/，经注册面 get_dialect_class 取用；缺省 "gemma4"。
    # gemma-4 家族（e4b / 12b 稠密 / 26b-a4b MoE / 31b 稠密）全填 gemma4；
    # 另有 qwen35 方言条目与 CUDA 侧条目在本表后段。
    # ⚠️ 换到 gemma-4 家族之外（Qwen3 / DeepSeek / GLM 等 ChatML 或 Harmony 系）时，
    # 必须新增对应的 dialects/<name>/ 并在此声明——只改 repo 不改 dialect 会让 prompt
    # 用错模板、工具调用全程解析不出来。方言与模型是绑定事实，不是可选配置。
    # capabilities：模态能力清单（值域 text/vision/audio，按各仓 config.json 的
    # vision_config/audio_config 实测填写，不按家族猜——e4b 有音频编码器、26b/31b 无）。
    # 供确定性路由（多模型协作接口准备②）经 model_capabilities() 读取；text 必含。
    # profile：model_eval 实测画像（benchmarks/model_eval/PROFILES.md 回填；口径 =
    # 通过率（含纠错与终答整合）与生成 tps 中位）。core/model_router 消费：main 粘滞，
    # 专科指标须显著超出（margin 0.05）才切换；**未画像条目绝不被优先选中**。
    # 勿手改——重跑 model_eval 后按新 run 回填（值是测出来的，不是配出来的）。
    # 〔e4b 三档 2026-08-14 已升钉；2026-08-16 全库横评（14 档同口径）已回填全部本地
    #  MLX 档 profile。gemma 家族 tool_call 列曾受 gemma4 方言 DSL 链路架构锅压制
    #  （带点工具名被解析侧拒收，七档同分 0.72/解析错 12）；2026-08-17 修复
    #  （commit a61e27e）后保留四档重测归零并已回填（runs 20260817-00*），
    #  详见 PROFILES.md 08-17 重测节。longchain/vision 列仍为 08-16 run。〕
    - repo: "mlx-community/gemma-4-e4b-it-8bit"
      revision: "4255b21bd9a9d3fc807ef7abd80373f5e3a52a73"  # 2026-08-14 升钉：上游 7/6 重转换件（0.6.x vendoring 对齐）
      dialect: "gemma4"
      capabilities: ["text", "vision", "audio"]
      profile: { tool_call: 0.88, longchain: 1.00, vision: 0.88, tps: 72.4 }  # tool run 20260817-004704，其余 20260816-034903
      note: "9.0GB | 缺省档（D.20 阵容收束，2026-08-16）| 装载生成 smoke ✓（2026-08-17）| 08-16 画像 ✓"
